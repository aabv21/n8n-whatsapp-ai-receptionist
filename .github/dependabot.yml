version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # NOTE: n8n publishes beta and stable releases under the same plain semver tag scheme (no
      # -beta suffix), so Dependabot can't tell them apart from the tag alone. Patch bumps still
      # come through; minor/major bumps to n8nio/n8n are reviewed and pinned by hand (R21).
      - dependency-name: n8nio/n8n
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
