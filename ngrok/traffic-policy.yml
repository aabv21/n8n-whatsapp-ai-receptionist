on_http_request:
  # req.url.raw_path is un-normalized (keeps percent-encoding literal), unlike
  # req.url.path which ngrok decodes first — checked here so an encoded trick
  # can't slip past as something that merely looks safe once decoded.
  - name: Refuse unsafe path encodings
    expressions:
      - 'req.url.raw_path.contains("%") || req.url.raw_path.contains("\\") || req.url.raw_path.contains("//") || req.url.raw_path.contains("/./") || req.url.raw_path.contains("/../")'
    actions:
      - type: deny
        config:
          status_code: 404
  # Allowlist: only the WhatsApp Trigger's own fixed webhookId
  # (workflows/whatsapp-entry.json) gets through, not any webhook-shaped path.
  # Meta's subscription-verification GET carries hub.* query parameters, not
  # path segments, and req.url.raw_path excludes the query string
  # (https://ngrok.com/docs/traffic-policy/variables/req/: "The full query
  # string ... excluding the leading question mark" is the separate
  # req.url.query), so that GET still matches this same anchored path.
  - name: Forward the WhatsApp trigger path only
    expressions:
      - '!req.url.raw_path.matches("^/webhook/a0000000-aaaa-4bbb-8ccc-000000000001/webhook$")'
    actions:
      - type: deny
        config:
          status_code: 404
