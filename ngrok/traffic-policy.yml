on_http_request:
  # req.url.raw_path keeps percent-encoding literal, unlike the decoded req.url.path,
  # so an encoded path can't pass as one that only looks safe once decoded.
  - name: Refuse unsafe path encodings
    expressions:
      - 'req.url.raw_path.contains("%") || req.url.raw_path.contains("\\") || req.url.raw_path.contains("//") || req.url.raw_path.contains("/./") || req.url.raw_path.contains("/../")'
    actions:
      - type: deny
        config:
          status_code: 404
  # Only the WhatsApp Trigger's own webhookId (workflows/whatsapp-entry.json) gets through.
  # req.url.raw_path excludes the query string, so Meta's verification GET, with its hub.*
  # query parameters, still matches (https://ngrok.com/docs/traffic-policy/variables/req/).
  - name: Forward the WhatsApp trigger path only
    expressions:
      - '!req.url.raw_path.matches("^/webhook/a0000000-aaaa-4bbb-8ccc-000000000001/webhook$")'
    actions:
      - type: deny
        config:
          status_code: 404
  # The trigger computes the HMAC over the whole body before rejecting a bad signature, so an
  # unsigned flood still burns CPU. 60/min is well above a clinic's rate (about four deliveries
  # per patient message, counting Meta's status callbacks), and Meta retries a refused delivery
  # for up to 7 days.
  - name: Rate limit by client IP
    actions:
      - type: rate-limit
        config:
          name: Rate limit by client IP
          algorithm: sliding_window
          capacity: 60
          rate: 60s
          bucket_key:
            - conn.client_ip
